name: Auto version bump and publish

# On every push to the default branch, decide a Conventional-Commits semver bump
# from the commits since the last vX.Y.Z tag and publish the package to npm with
# provenance (OIDC trusted publishing — no NPM_TOKEN). The version is tracked by
# the npm registry and git tags, never committed to package.json. The Claude API
# drafts the CHANGELOG prose and degrades to a plain commit list when it is
# unavailable. See .github/scripts/version-bump.sh for the full logic.
#
# Self-publish guard: version-bump.sh exits early when package.json has
# "private": true, so the template repo never publishes itself. A downstream
# repo opts in by dropping `private` and setting a real, publishable name.
#
# Versioned-app workflow: only adopt this in a repo that is published to npm and
# has no publisher of its own. It is listed in the template-sync OPT_IN_PATHS, so
# the sync never introduces it — a repo that does not have this file keeps not
# having it, and deleting it is how you opt back out. Two publishers on one
# default branch race the same semver bump and the loser fails with an
# unrecognizable npm E404 on an already-published version.

on:
  push:
    branches: [main, master]

concurrency:
  group: auto-version
  cancel-in-progress: false

permissions:
  contents: write
  # Required for npm OIDC trusted publishing (`pnpm publish --provenance`).
  id-token: write

jobs:
  version-and-publish:
    name: Bump version and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # Credentials stay persisted: version-bump.sh pushes the release-docs
        # commit and the vX.Y.Z tag with them.
        #
        # Which token to use:
        #   - Unprotected default branch: GITHUB_TOKEN's `contents: write`
        #     authorizes github-actions[bot] to push to the branch and tags of
        #     its own repo, so the fallback rung suffices.
        #   - Default branch protected by a ruleset with required status checks:
        #     GITHUB_TOKEN's push is rejected with GH013, which strands the
        #     release — npm publishes but the tag and docs commit never land, so
        #     the next run re-reads the climbed npm version and bumps again.
        #     TEMPLATE_SYNC_TOKEN_ORG is the org-wide PAT registered as a bypass
        #     actor on those rulesets, so its push lands.
        #
        # The PAT must belong to this repo's own owner: a PAT minted for a
        # different owner is rejected 403 and strands the release the same way.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          # Need full history so `git describe`/`git log` can find the last tag.
          fetch-depth: 0
          # token-fallback-ok: on a fork there is no org PAT and no protected
          # default branch, so GITHUB_TOKEN is correct there rather than degraded.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.GITHUB_TOKEN }}

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          # Pin the publish runtime explicitly: npm OIDC trusted publishing needs
          # a recent npm.
          #
          # No registry-url. setup-node answers it by writing an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}`, and this job has no npm token to put
          # there, so npm sends an empty credential and takes that path instead of
          # OIDC. The registry answers the PUT with a bare E404 that names neither
          # cause. The default registry is registry.npmjs.org anyway.
          node-version: 24
          # uv, so .hooks/pre-push can run pre-commit over the `docs: release`
          # commit this job pushes. Without it the hook refuses that push and the
          # release publishes to npm with its CHANGELOG section stranded.
          setup-python: true

      - name: Bump version and publish if commits warrant a release
        # The changelog-prose call walks the claude-oauth-ladder.bash
        # subscription tokens; there is no metered API-key rung.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
        run: bash .github/scripts/version-bump.sh
